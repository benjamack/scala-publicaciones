name: Publicar en Instagram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    # El entorno «espera» tiene un temporizador de 5 minutos: la corrida espera ahí,
    # sin ocupar una máquina, y recién después arranca.
    environment: espera
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publicar lo que ya llegó a su hora
        run: python3 ig.py agenda
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

      - name: Guardar lo publicado
        if: always()
        run: |
          if git diff --quiet -- publicadas.json; then
            echo "Nada cambió en publicadas.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicadas.json
            git commit -m "Lo publicado, al día"
            # Si el repo cambió mientras corría (una agenda nueva), se trae antes de subir.
            git pull --rebase
            git push
          fi

      - name: Pedir la próxima corrida
        if: ${{ !cancelled() && vars.CADENA != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          creada=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          espero=$(( $(date +%s) - $(date -d "$creada" +%s) ))
          if [ "$espero" -lt 240 ]; then
            echo "Esta corrida no esperó (${espero} s): el entorno «espera» no tiene su temporizador. No se pide la siguiente."
            exit 0
          fi
          # La API de GitHub a veces contesta 502: se reintenta, y si no sale, el cron retoma la cadena.
          # Que falle este paso no es que falló la publicación: no pone la corrida en rojo.
          for intento in 1 2 3; do
            if gh workflow run publicar.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then exit 0; fi
            sleep 15
          done
          echo "No se pudo pedir la próxima corrida. La retoma el cron."
